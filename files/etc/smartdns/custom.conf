# =============================================================================
# SmartDNS 自定义配置（本文件会被 smartdns 无条件加载，见 init 脚本 conf-file）
#
# 上游服务器在 LuCI「服务 -> SmartDNS -> 上游服务器」里，本文件只放分流规则。
#   默认组   = 国内 DNS（阿里/腾讯/百度，测速优选）
#   opendns  = OpenDNS（208.67.222.222 / 220.220 / DoH），供境外域名使用
# =============================================================================

# --- 基础行为 ---------------------------------------------------------------
# 境外域名解析失败时不要立刻返回 SOA，交给 Passwall/OpenClash 的远程 DNS 兜底
force-AAAA-SOA no
# 过滤掉运营商常见的 NXDOMAIN 劫持地址
bogus-nxdomain 0.0.0.0/8
bogus-nxdomain 127.0.0.1
bogus-nxdomain 39.156.69.79
bogus-nxdomain 114.114.114.114

# --- 境外域名 -> OpenDNS 组 --------------------------------------------------
# 说明：这里只列高频域名。启用 Passwall 后，完整的 GFW 分流由 Passwall 接管，
#      本节相当于"没开代理时也尽量拿到干净解析"的兜底。
nameserver /google.com/opendns
nameserver /googleapis.com/opendns
nameserver /gstatic.com/opendns
nameserver /googlevideo.com/opendns
nameserver /youtube.com/opendns
nameserver /ytimg.com/opendns
nameserver /ggpht.com/opendns
nameserver /github.com/opendns
nameserver /githubusercontent.com/opendns
nameserver /githubassets.com/opendns
nameserver /ghcr.io/opendns
nameserver /twitter.com/opendns
nameserver /x.com/opendns
nameserver /twimg.com/opendns
nameserver /facebook.com/opendns
nameserver /fbcdn.net/opendns
nameserver /instagram.com/opendns
nameserver /telegram.org/opendns
nameserver /t.me/opendns
nameserver /whatsapp.com/opendns
nameserver /wikipedia.org/opendns
nameserver /wikimedia.org/opendns
nameserver /openai.com/opendns
nameserver /chatgpt.com/opendns
nameserver /anthropic.com/opendns
nameserver /claude.ai/opendns
nameserver /cloudflare.com/opendns
nameserver /cloudflare-dns.com/opendns
nameserver /docker.com/opendns
nameserver /docker.io/opendns
nameserver /npmjs.com/opendns
nameserver /pypi.org/opendns
nameserver /netflix.com/opendns
nameserver /nflxvideo.net/opendns
nameserver /disneyplus.com/opendns
nameserver /spotify.com/opendns
nameserver /reddit.com/opendns
nameserver /medium.com/opendns
nameserver /stackoverflow.com/opendns
nameserver /discord.com/opendns
nameserver /steamcommunity.com/opendns

# --- 国内域名强制走默认组（避免误判绕路）-------------------------------------
nameserver /cn/default
nameserver /baidu.com/default
nameserver /qq.com/default
nameserver /taobao.com/default
nameserver /tmall.com/default
nameserver /alipay.com/default
nameserver /aliyun.com/default
nameserver /jd.com/default
nameserver /bilibili.com/default
nameserver /hdslb.com/default
nameserver /douyin.com/default
nameserver /weixin.qq.com/default
nameserver /163.com/default
nameserver /126.net/default
nameserver /mi.com/default
nameserver /xiaomi.com/default
nameserver /huawei.com/default
nameserver /bytedance.com/default

# --- 内网 / 特殊域名：不测速、直接透传 ---------------------------------------
domain-rules /lan/ -speed-check-mode none
domain-rules /local/ -speed-check-mode none
domain-rules /home.arpa/ -speed-check-mode none

# --- 广告与遥测屏蔽（返回 0.0.0.0，按需增删）---------------------------------
address /doubleclick.net/#
address /googleadservices.com/#
address /googlesyndication.com/#
address /google-analytics.com/#
address /googletagmanager.com/#
address /adservice.google.com/#
address /pagead2.googlesyndication.com/#
address /cm.g.doubleclick.net/#
address /analytics.163.com/#
address /pingma.qq.com/#
address /mtalk.google.com/#

# --- 想加自己的规则就写在下面 -------------------------------------------------
# 例：把某域名钉死到指定 IP
#   address /nas.mydomain.com/192.168.2.10
# 例：把某域名指到 opendns 组
#   nameserver /example.com/opendns
